<!-- Fő háttér polírozott Ford kék és mély magenta színátmenettel -->
<div class="flex flex-col test min-h-screen bg-gradient-to-b from-[#0a1628] to-[#000a21] text-white pb-20">
  <div class="shrink-0 pt-10 px-6">
    <div class="text-sm text-blue-300/70 font-bold mb-4 px-12 text-color-white/80">
          {{ maxItemCount | paginationCount: currentPage: limit }}
    </div>
    <div  class="flex justify-center flex-row gap-2 text-sm text-blue-300/70 font-bold mb-4 px-12 text-color-white/80">
      <button *ngFor="let page of [].constructor(maxPageCount); let i = index;" (click)="goToPage(i + 1)"
              [ngClass]="currentPage === i + 1 ? 'text-pink-300 hover:text-pink-100 hover:bg-pink-900/30' : 'text-blue- 300 hover:text-blue-100 hover:bg-blue-900/40'"
              class="px-3 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 cursor-pointer w-content">
        {{ i + 1 }}
      </button>
    </div>
  </div>
  <div class="flex-1 overflow-y-auto">
    <div #scrollable class="space-y-4 px-12 w-full">
      <!-- Ciklus a felhasználókon -->
      <div *ngFor="let user of users$ | async" 
          (click)="onUserSelected(user)"
          [ngClass]="{
            'scale-x-[1.04] scale-y-[1.06] bg-gradient-to-r from-[#d91b5c] to-[#9a0f74] shadow-[0_0_25px_rgba(217,27,92,0.55)] border-pink-400 z-20': activeUserId === user.id,
            'bg-[#0f2a4a]/60 border-blue-900/40 hover:scale-x-[1.03] hover:scale-y-[1.04] hover:bg-gradient-to-r hover:from-[#144d75] hover:to-[#5e1252] hover:shadow-[0_8px_20px_rgba(0,0,0,0.4)]': activeUserId !== user.id,
            'z-30 relative': openMenuId === user.id,
            'z-0': activeUserId !== user.id && openMenuId !== user.id
          }"
          class="p-5 rounded-xl border backdrop-blur-md flex items-center justify-between transition-all duration-300 ease-out cursor-pointer relative group">
        
        <!-- Felhasználó információk -->
        <div class="flex items-center gap-4">
          <div>
            <p [ngClass]="activeUserId === user.id ? 'text-white' : 'text-blue-100'" class="font-bold text-base transition-colors">
              {{ user.username }}
            </p>
            <p [ngClass]="activeUserId === user.id ? 'text-pink-200' : 'text-blue-300/70'" class="text-xs mt-0.5 transition-colors">
              {{ user.email }}
            </p>
          </div>
        </div>

        <!-- 3 pontos Opciók Menü konténer -->
        <div class="relative" (click)="$event.stopPropagation()">
          <button (click)="toggleMenu(user.id)" 
                  [ngClass]="activeUserId === user.id ? 'text-white hover:bg-white/10' : 'text-blue-300 hover:bg-blue-900/40 hover:text-pink-400'"
                  class="p-2 rounded-full focus:outline-none transition-all">
            <svg class="w-5 h-5 cursor-pointer" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
          </button>

          <!-- Dropdown Menü (Mentés / Módosítás) -->
          <div *ngIf="openMenuId === user.id" 
              class="absolute right-0 mt-2 w-48 bg-[#0a192f] border border-blue-800/60 rounded-lg shadow-2xl py-1 z-50 animate-fade-in text-left">
            
            <button (click)="onSave(user.id)" 
                    class="w-full px-4 py-2.5 text-sm text-blue-200 hover:bg-blue-900/50 hover:text-white flex items-center gap-2 transition-colors cursor-pointer">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
              {{ 'musicOptions.save' | translate }}
            </button>

            <div class="border-t border-blue-900/30 my-1"></div>

            <button (click)="onUpdateUser(user)" 
                    class="w-full px-4 py-2.5 text-sm text-pink-200 hover:bg-pink-900/30 hover:text-white flex items-center gap-2 transition-colors cursor-pointer">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              Update User
            </button>

          </div>
        </div>

      </div>

    </div>
  </div>
</div>
