<div class="min-h-screen bg-gradient-to-br from-[#000a21] via-[#0b3c5d] to-[#000a21] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-md">
    <!-- Login Card -->
    <div class="bg-[#0a192f]/80 backdrop-blur-md border border-blue-900/40 rounded-2xl shadow-2xl p-8 space-y-8">
      
      <!-- Header -->
      <div class="text-center space-y-4">
        <h1 class="text-4xl font-extrabold bg-gradient-to-r from-blue-400 to-pink-500 bg-clip-text text-transparent drop-shadow-[0_2px_8px_rgba(217,27,92,0.3)]">
          {{ 'login.title' | translate }}
        </h1>
        <p class="text-blue-300/70 text-sm">{{ 'login.signInParagraph' | translate }}</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-6">
        
        <!-- Email Input -->
        <div class="space-y-2">
          <label for="email" class="block text-sm font-semibold text-blue-200">
            {{ 'login.email' | translate }}
          </label>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            required
            placeholder="{{ 'login.emailPlaceholder' | translate }}"
            class="w-full px-4 py-3 bg-[#000a21] border border-blue-800/50 rounded-lg text-white placeholder-blue-400/40 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all duration-200">
        </div>

        <!-- Password Input with Show/Hide -->
        <div class="space-y-2">
          <label for="password" class="block text-sm font-semibold text-blue-200">
            {{ 'login.password' | translate }}
          </label>
          <div class="relative">
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              formControlName="password" 
              required
              placeholder="{{ 'login.passwordPlaceholder' | translate }}"
              class="w-full px-4 py-3 bg-[#000a21] border border-blue-800/50 rounded-lg text-white placeholder-blue-400/40 focus:outline-none focus:ring-2 focus:ring-pink-500 focus:border-transparent transition-all duration-200">
          </div>
            
          <!-- Show/Hide Password Checkbox -->
          <div class="mt-4 flex items-center gap-2">
            <input 
              type="checkbox" 
              id="showPassword" 
              (change)="showPassword = !showPassword"
              class="w-4 h-4 cursor-pointer accent-pink-500">
            <label for="showPassword" class="text-xs text-blue-300/70 cursor-pointer select-none">
              {{ 'login.showPassword' | translate }}
            </label>
          </div>
        </div>

        <!-- Login Button -->
        <button 
          type="submit" 
          class="w-full py-3 mt-8 bg-gradient-to-r from-blue-500 to-pink-500 hover:from-blue-600 hover:to-pink-600 text-white font-bold rounded-lg transition-all duration-200 transform hover:scale-105 shadow-lg hover:shadow-pink-500/50 cursor-pointer">
          {{ 'login.signIn' | translate }}
        </button>
      </form>

      <!-- Divider
      <div class="relative">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-blue-900/30"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-[#0a192f] text-blue-400/70">or</span>
        </div>
      </div>

      Footer
      <div class="text-center">
        <p class="text-blue-300/70 text-sm">
          Don't have an account?
          <a href="#" class="text-pink-400 hover:text-pink-300 font-semibold transition-colors">
            Sign up
          </a>
        </p>
      </div> -->

    </div>

    <!-- Background Decoration -->
    <div class="mt-8 text-center">
      <p class="text-blue-900/50 text-xs">MusicPlayer © 2026</p>
    </div>
  </div>
</div>
